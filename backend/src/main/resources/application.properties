spring.application.name=auto-servisi
server.port=8080

# Spajanje na lokalnu PostgreSQL bazu.
# Lozinka se čita iz varijable okruženja DB_PASSWORD (postavi je u IntelliJ:
# Run > Edit Configurations > Environment variables > DB_PASSWORD=tvojaLozinka),
# kako ne bi završila u git repozitoriju.
spring.datasource.url=jdbc:postgresql://localhost:5432/auto_servisi
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}

# Polja Java recorda (npr. centarNaziv) u JSON-u se pišu kao centar_naziv,
# isto kao stupci u bazi i u CSV-u
spring.jackson.property-naming-strategy=SNAKE_CASE

# Mapa u kojoj se nalaze auto_servisi.csv, auto_servisi.json i schema.json
# (korijen repozitorija; putanja je relativna u odnosu na mapu backend)
app.data-dir=..
